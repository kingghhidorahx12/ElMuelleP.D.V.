<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bandeja privada · El Muelle PDV</title><link rel="stylesheet" href="./admin.css"></head><body><main>
<header><h1>Bandeja privada de soporte</h1><p>Acceso exclusivo del responsable de soporte. No uses el PIN del POS.</p></header>
<form id="login"><label>Clave administrativa del receptor<input id="token" type="password" autocomplete="off" maxlength="64" required></label><button>Entrar</button></form>
<p id="notice" role="status" aria-live="polite"></p>
<section id="inbox" hidden><div class="toolbar"><label>Estado<select id="filterStatus"><option value="">Todos</option><option value="recibido">Recibido</option><option value="en_revision">En revisión</option><option value="resuelto">Resuelto</option><option value="cerrado">Cerrado</option></select></label><label>Tipo<select id="filterKind"><option value="">Todos</option><option value="error">Error</option><option value="sugerencia">Sugerencia</option><option value="queja">Queja</option></select></label><button id="refresh" type="button">Consultar</button><button id="createEnrollment" type="button" hidden>Activar otra instalación</button><button id="logout" type="button">Salir</button></div><p id="enrollmentCode" role="status"></p><div id="reports"></div><button id="more" type="button">Siguientes</button></section>
<dialog id="detail"><button id="close" type="button">Cerrar</button><h2 id="title"></h2><p id="description"></p><p id="receipt"></p><div id="images"></div><div id="replies"></div><form id="respond"><label>Estado<select id="status"><option value="recibido">Recibido</option><option value="en_revision">En revisión</option><option value="resuelto">Resuelto</option><option value="cerrado">Cerrado</option></select></label><label>Clasificación<select id="classification"><option value="sin_clasificar">Sin clasificar</option><option value="seguridad">Seguridad</option><option value="operacion">Operación</option><option value="interfaz">Interfaz</option><option value="otro">Otro</option></select></label><label>Respuesta para el cliente (opcional)<textarea id="reply" maxlength="2000" rows="5"></textarea></label><button>Guardar seguimiento</button></form><p id="detailNotice" role="status"></p></dialog>
</main><script src="./admin.js"></script></body></html>
