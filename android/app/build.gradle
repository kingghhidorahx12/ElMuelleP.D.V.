plugins { id 'com.android.application' }
android {
 namespace 'mx.elmuelle.pdv'
 compileSdk 36
 ndkVersion '27.2.12479018'
 buildFeatures { buildConfig true }
 defaultConfig {
  applicationId 'mx.elmuelle.pdv'
  minSdk 26
  targetSdk 35
  versionCode 23
  versionName '1.0.22-android-prueba'
  ndk { abiFilters 'arm64-v8a','armeabi-v7a','x86_64' }
  externalNativeBuild { cmake { cppFlags '-std=c++20'; arguments '-DANDROID_STL=c++_shared' } }
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 packaging { jniLibs { useLegacyPackaging=true; pickFirsts+=['**/libc++_shared.so'] } }
 signingConfigs {
  privateRelease {
   if(System.getenv('MUELLE_ANDROID_KEYSTORE')) {
    storeFile file(System.getenv('MUELLE_ANDROID_KEYSTORE'))
    storePassword System.getenv('MUELLE_ANDROID_STORE_PASS')
    keyAlias 'elmuelle-pdv'
    keyPassword System.getenv('MUELLE_ANDROID_STORE_PASS')
   }
  }
 }
 buildTypes { debug { applicationIdSuffix '.test'; debuggable true }; release { minifyEnabled false; debuggable false; signingConfig signingConfigs.privateRelease } }
 testOptions { unitTests.returnDefaultValues=false }
}
dependencies {
 implementation 'androidx.core:core:1.15.0'
 implementation 'androidx.core:core-splashscreen:1.2.0'
 implementation 'com.github.mik3y:usb-serial-for-android:3.11.0'
 implementation 'net.zetetic:sqlcipher-android:4.20.0@aar'
 implementation 'androidx.sqlite:sqlite:2.5.0'
 testImplementation 'junit:junit:4.13.2'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
